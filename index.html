<!DOCTYPE html>
<html>
<head>
  <title>Happy Valentine's Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(180deg, #ffe6f0 0%, #ffd6e8 100%);
      text-align: center;
      padding: 50px;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      animation: pageFade 1s ease-out;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 500px;
      margin: auto;
      position: relative;
      z-index: 2;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      animation: cardFloat 4s ease-in-out infinite;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 10px 24px rgba(255, 77, 136, 0.22);
    }

    h1 {
      font-family: "Dancing Script", cursive;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #740e30;
      animation: popIn 0.9s ease-out;
    }

    .flower-image {
      width: 120px;
      height: auto;
      display: block;
      margin: 10px auto 18px;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }

    .typewriter {
      min-height: 3em;
      margin: 0 0 1em;
    }

    .typewriter::after {
      content: "|";
      color: #ff4d88;
      margin-left: 2px;
      animation: blink 0.7s step-end infinite;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
      animation: twinkle 3.2s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { top: 12%; left: 14%; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 25%; left: 78%; animation-delay: 0.8s; }
    .sparkle:nth-child(3) { top: 42%; left: 32%; animation-delay: 1.4s; }
    .sparkle:nth-child(4) { top: 55%; left: 86%; animation-delay: 2s; }
    .sparkle:nth-child(5) { top: 66%; left: 20%; animation-delay: 0.5s; }
    .sparkle:nth-child(6) { top: 80%; left: 63%; animation-delay: 1.8s; }
    .sparkle:nth-child(7) { top: 36%; left: 57%; animation-delay: 2.6s; }
    .sparkle:nth-child(8) { top: 18%; left: 49%; animation-delay: 1.1s; }

    .heart {
      position: absolute;
      bottom: -40px;
      color: #ff4d88;
      opacity: 0.75;
      animation: rise linear infinite;
      text-shadow: 0 4px 10px rgba(255, 77, 136, 0.35);
    }

    .heart:nth-child(1) { left: 8%; font-size: 18px; animation-duration: 8s; animation-delay: 0s; }
    .heart:nth-child(2) { left: 20%; font-size: 24px; animation-duration: 11s; animation-delay: 1s; }
    .heart:nth-child(3) { left: 35%; font-size: 16px; animation-duration: 9s; animation-delay: 2s; }
    .heart:nth-child(4) { left: 50%; font-size: 22px; animation-duration: 12s; animation-delay: 0.5s; }
    .heart:nth-child(5) { left: 65%; font-size: 20px; animation-duration: 10s; animation-delay: 1.5s; }
    .heart:nth-child(6) { left: 80%; font-size: 26px; animation-duration: 13s; animation-delay: 3s; }
    .heart:nth-child(7) { left: 92%; font-size: 17px; animation-duration: 8.5s; animation-delay: 2.2s; }

    @keyframes rise {
      0% {
        transform: translateY(0) translateX(0) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 0.75;
      }
      100% {
        transform: translateY(-115vh) translateX(-20px) scale(1.2);
        opacity: 0;
      }
    }

    @keyframes pageFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes popIn {
      from {
        transform: scale(0.9);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.7);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 24px;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
  </div>

  <div class="hearts" aria-hidden="true">
    <span class="heart">&#10084;</span>
    <span class="heart">&#10084;</span>
    <span class="heart">&#10084;</span>
    <span class="heart">&#10084;</span>
    <span class="heart">&#10084;</span>
    <span class="heart">&#10084;</span>
    <span class="heart">&#10084;</span>
  </div>

  <div class="card">
    <h1>Happy Valentine's Day &#128150;</h1>
    <img src="flowerimgae.jpg" alt="Flower" class="flower-image">
    <p class="typewriter" id="typewriter-text" data-text="To my amazing friends - thank you for being kind, supportive, funny, and wonderful people. Thank you for showing what it means to be loved genuinely and sweetly💐"></p>
    <p>
      I'm really grateful to have you in my life &#127800;
    </p>
  </div>

  <script>
    const typewriterEl = document.getElementById("typewriter-text");
    const fullText = typewriterEl.dataset.text;
    let index = 0;

    function typeNextChar() {
      if (index <= fullText.length) {
        typewriterEl.textContent = fullText.slice(0, index);
        index += 1;
        setTimeout(typeNextChar, 45);
      }
    }

    setTimeout(typeNextChar, 700);
  </script>
</body>
</html>
